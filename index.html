<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Cyber Code Generator v4.0</title>
  <style>
    * {
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    :root {
      --bg: #060814;
      --panel: rgba(10, 15, 30, 0.7);
      --panel-glow: rgba(6, 182, 212, 0.05);
      --ink: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(51, 65, 85, 0.4);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.3);
      --blue: #3b82f6;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --purple: #a855f7;
      --orange: #f97316;
      --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      background: 
        radial-gradient(circle at top left, rgba(6, 182, 212, 0.12), transparent 45rem),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.12), transparent 45rem),
        var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .app {
      width: min(100%, 900px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .topbar {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
      padding: 32px 24px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      position: relative;
    }

    .topbar::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 25%;
      width: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(6, 182, 212, 0.1);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .content {
      padding: 32px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .input-group {
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--cyan);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      height: 54px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 18px;
      font-size: 16px;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.5);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
      outline: none;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px var(--cyan-glow), inset 0 2px 4px rgba(0,0,0,0.3);
      background: rgba(15, 23, 42, 0.7);
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex-grow: 1;
      height: 1px;
      background: var(--line);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
      margin-bottom: 32px;
    }

    .feature-btn {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.3);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .feature-btn:hover {
      background: rgba(51, 65, 85, 0.5);
      border-color: var(--muted);
      transform: translateY(-2px);
    }

    .feature-btn.active {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #020617;
      border-color: transparent;
      box-shadow: 0 8px 20px var(--cyan-glow);
      font-weight: 700;
      transform: translateY(-2px);
    }

    .actions {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      margin-bottom: 36px;
    }

    .main-btn {
      min-height: 56px;
      border: 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .generate {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
    }

    .generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.4);
    }

    .copy-all {
      background: var(--green);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
    }

    .copy-all:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--green-glow);
    }

    .display-container {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 24px;
    }

    .output {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.3);
    }

    .row {
      display: grid;
      grid-template-columns: 110px 1fr 70px;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .key {
      font-weight: 700;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .value {
      overflow-wrap: anywhere;
      font-weight: 600;
      color: #ffffff;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 15px;
      letter-spacing: -0.3px;
    }

    .small-copy {
      min-height: 34px;
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 8px;
      background: rgba(6, 182, 212, 0.08);
      color: #22d3ee;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .small-copy:hover {
      background: var(--cyan);
      color: #020617;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }

    .bulk-view {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(5, 8, 18, 0.6);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .bulk-view textarea {
      width: 100%;
      flex-grow: 1;
      background: transparent;
      border: 0;
      color: #34d399;
      font-family: monospace;
      font-size: 14px;
      resize: none;
      outline: none;
      line-height: 1.7;
    }

    .strength-wrapper {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .strength-bar {
      height: 6px;
      width: 90px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .strength-fill {
      height: 100%;
      width: 0%;
      background: var(--orange);
    }
    
    .strength-text {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .message {
      min-height: 28px;
      margin-top: 24px;
      color: var(--green);
      font-weight: 700;
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .field-grid, .actions, .display-container {
        grid-template-columns: 1fr;
      }
      .bulk-view {
        min-height: 150px;
      }
      .content {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .row {
        grid-template-columns: 1fr;
        gap: 8px;
        text-align: left;
        padding: 16px;
      }
      .small-copy {
        width: 100%;
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>CYBER FORMAT GENERATOR</h1>
      <p class="subtitle">Secure multi-mode account string generation system</p>
    </header>

    <section class="content">
      <div class="field-grid">
        <div class="input-group">
          <label for="name">Target Full Name</label>
          <input id="name" type="text" value="Sawan Kumar" placeholder="e.g. Sawan Kumar">
        </div>

        <div class="input-group">
          <label for="number">Target Mobile No.</label>
          <input id="number" type="tel" value="9078977867" placeholder="10 Digits digits only" maxlength="10">
        </div>
      </div>

      <div class="section-title">Select Operational Template</div>
      <div class="features">
        <button class="feature-btn active" type="button" data-mode="normal">Normal</button>
        <button class="feature-btn" type="button" data-mode="pro">Pro ID</button>
        <button class="feature-btn" type="button" data-mode="secure">Secure</button>
        <button class="feature-btn" type="button" data-mode="short">Short</button>
        <button class="feature-btn" type="button" data-mode="alpha">Alpha</button>
        <button class="feature-btn" type="button" data-mode="numeric">Numeric</button>
        <button class="feature-btn" type="button" data-mode="premium">Premium</button>
        <button class="feature-btn" type="button" data-mode="minimal">Minimal</button>
        <button class="feature-btn" type="button" data-mode="gaming">Gaming</button>
        <button class="feature-btn" type="button" data-mode="enterprise">Enterprise</button>
        <button class="feature-btn" type="button" data-mode="developer">Developer</button>
        <button class="feature-btn" type="button" data-mode="vintage">Vintage</button>
        <button class="feature-btn" type="button" data-mode="crypto">Crypto</button>
        <button class="feature-btn" type="button" data-mode="cyber">Cyber</button>
        <button class="feature-btn" type="button" data-mode="hybrid">Hybrid</button>
      </div>

      <div class="actions">
        <button class="main-btn generate" id="generateBtn" type="button">⚡ Compile Format</button>
        <button class="main-btn copy-all" id="copyBtn" type="button">📋 Quick Copy Bulk</button>
      </div>

      <div class="display-container">
        <section class="output">
          <div class="row">
            <span class="key">User Email</span>
            <span class="value" id="email">-</span>
            <button class="small-copy" type="button" data-copy-target="email">Copy</button>
          </div>

          <div class="row">
            <span class="key">User ID</span>
            <span class="value" id="userId">-</span>
            <button class="small-copy" type="button" data-copy-target="userId">Copy</button>
          </div>

          <div class="row">
            <div>
              <span class="key">User PS</span>
              <div class="strength-wrapper">
                <div class="strength-bar"><div class="strength-fill" id="strBar"></div></div>
                <span class="strength-text" id="strText">None</span>
              </div>
            </div>
            <span class="value" id="password">-</span>
            <button class="small-copy" type="button" data-copy-target="password">Copy</button>
          </div>

          <div class="row">
            <span class="key">Phone No.</span>
            <span class="value" id="phone">-</span>
            <button class="small-copy" type="button" data-copy-target="phone">Copy</button>
          </div>
        </section>

        <section class="bulk-view">
          <div class="section-title" style="color: var(--green); margin-bottom: 12px;">Bulk String Output</div>
          <textarea id="bulkText" readonly placeholder="Bulk content will appear here..."></textarea>
        </section>
      </div>

      <div class="message" id="message"></div>
    </section>
  </main>

  <script>
    const nameInput = document.getElementById('name');
    const numberInput = document.getElementById('number');
    const emailOutput = document.getElementById('email');
    const userIdOutput = document.getElementById('userId');
    const passwordOutput = document.getElementById('password');
    const phoneOutput = document.getElementById('phone');
    const bulkText = document.getElementById('bulkText');
    const message = document.getElementById('message');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const featureButtons = document.querySelectorAll('[data-mode]');
    const singleCopyButtons = document.querySelectorAll('[data-copy-target]');
    const strBar = document.getElementById('strBar');
    const strText = document.getElementById('strText');

    let activeMode = 'normal';

    function onlyDigits(value) {
      return value.replace(/\D/g, '');
    }

    function makeParts(name) {
      return name.trim().split(/\s+/).filter(Boolean);
    }

    function makePascalName(name) {
      return makeParts(name)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
        .join('');
    }

    function makeLowerName(name) {
      return makeParts(name).join('').toLowerCase();
    }

    function makeSnakeName(name) {
      return makeParts(name).join('_').toLowerCase();
    }

    function makeInitials(name) {
      return makeParts(name).map(part => part.charAt(0).toUpperCase()).join('');
    }

    function reverseText(text) {
      return text.split('').reverse().join('');
    }

    function makeStrictPassword(prefix, body, numbers, symbol) {
      let caps = prefix.replace(/[^A-Z]/g, '') || 'K';
      let smalls = body.replace(/[^a-z]/g, '') || 'usr';
      let digits = numbers.replace(/[^0-9]/g, '') || '786';
      let sym = symbol || '@';

      if(caps.length === 0) caps = 'S';
      if(smalls.length === 0) smalls = 'am';
      if(digits.length === 0) digits = '90';

      return `${caps.slice(0,3)}${smalls.slice(0,4)}${digits.slice(0,4)}${sym}`;
    }

    function buildCode(rawName, phone) {
      const pascalName = makePascalName(rawName) || 'User';
      const lowerName = makeLowerName(rawName) || 'user';
      const snakeName = makeSnakeName(rawName) || 'user';
      const initials = makeInitials(rawName) || 'UR';

      const firstTwo = phone.slice(0, 2) || '99';
      const firstFour = phone.slice(0, 4) || '9999';
      const middleFour = phone.slice(2, 6) || '8888';
      const lastTwo = phone.slice(-2) || '00';
      const lastFour = phone.slice(-4) || '0000';
      const reverseFour = reverseText(lastFour);
      const reversePhone = reverseText(phone).slice(0, 4);

      switch (activeMode) {
        case 'pro':
          return {
            email: `${lowerName}.${lastFour}@outlook.com`,
            userId: `${initials}${lastFour}${firstTwo}`,
            password: makeStrictPassword(initials, lowerName, lastFour, '#'),
            phone
          };
        case 'secure':
          return {
            email: `${lowerName}_${middleFour}@outlook.com`,
            userId: `${pascalName}${middleFour}`,
            password: makeStrictPassword(pascalName, 'sec', phone, '@'),
            phone
          };
        case 'short':
          return {
            email: `${lowerName}${lastTwo}${firstTwo}@outlook.com`,
            userId: `${lowerName}${reverseFour}`,
            password: makeStrictPassword(initials, 'sh', lastTwo + firstTwo, '$'),
            phone
          };
        case 'alpha':
          return {
            email: `${snakeName}.alpha@outlook.com`,
            userId: `Alpha${pascalName}`,
            password: makeStrictPassword(pascalName, 'alpha', lastFour, '!'),
            phone
          };
        case 'numeric':
          return {
            email: `${firstFour}${lastFour}@outlook.com`,
            userId: `num${phone.slice(-6)}`,
            password: makeStrictPassword(initials, 'num', phone, '#'),
            phone
          };
        case 'premium':
          return {
            email: `${lowerName}.vip@outlook.com`,
            userId: `VIP${pascalName}`,
            password: makeStrictPassword('VIP', lowerName, lastFour, '$'),
            phone
          };
        case 'minimal':
          return {
            email: `${initials.toLowerCase()}${lastTwo}@outlook.com`,
            userId: `${initials.toLowerCase()}${lastTwo}`,
            password: makeStrictPassword(initials, 'min', lastTwo, '*'),
            phone
          };
        case 'gaming':
          return {
            email: `${lowerName}_gg@outlook.com`,
            userId: `${pascalName}PRO`,
            password: makeStrictPassword('GG', lowerName, reverseFour, '!'),
            phone
          };
        case 'enterprise':
          return {
            email: `${lowerName}@corp.outlook.com`,
            userId: `emp${lowerName}${lastTwo}`,
            password: makeStrictPassword('HQ', lowerName, lastFour, '#'),
            phone
          };
        case 'developer':
          return {
            email: `${snakeName}_dev@outlook.com`,
            userId: `dev${lowerName}`,
            password: makeStrictPassword('DEV', 'git', lastTwo, '!'),
            phone
          };
        case 'vintage':
          return {
            email: `classic.${lowerName}@outlook.com`,
            userId: `the${lowerName}90s`,
            password: makeStrictPassword('OLD', lowerName, middleFour, '_'),
            phone
          };
        case 'crypto':
          return {
            email: `${lowerName}.eth@outlook.com`,
            userId: `X0x${initials}${lastFour}`,
            password: makeStrictPassword('HEX', 'eth', lastFour, '$'),
            phone
          };
        case 'cyber':
          return {
            email: `${lowerName}.nexus@outlook.com`,
            userId: `cyber${pascalName}`,
            password: makeStrictPassword('CYB', 'core', lastFour, '%'),
            phone
          };
        case 'hybrid':
          return {
            email: `${reverseFour}${lowerName}${firstTwo}@outlook.com`,
            userId: `${pascalName}${lastTwo}${firstTwo}`,
            password: makeStrictPassword(initials, 'mix', reversePhone, '!'),
            phone
          };
        default:
          return {
            email: `${lowerName}${firstFour}${lastTwo}@outlook.com`,
            userId: `${pascalName}${firstFour}`,
            password: makeStrictPassword(pascalName, 'norm', lastFour, '@'),
            phone
          };
      }
    }

    function updateStrengthMeter(pass) {
      if (!pass || pass === '-') {
        strBar.style.width = '0%';
        strText.textContent = 'None';
        strText.style.color = 'var(--muted)';
        return;
      }
      
      let score = 0;
      if (pass.length >= 8) score += 25;
      if (/[A-Z]/.test(pass)) score += 25;
      if (/[a-z]/.test(pass)) score += 25;
      if (/[0-9]/.test(pass) && /[^A-Za-z0-9]/.test(pass)) score += 25;

      strBar.style.width = score + '%';
      
      if(score <= 50) {
        strBar.style.backgroundColor = 'var(--orange)';
        strText.textContent = 'Strong';
        strText.style.color = 'var(--orange)';
      } else if (score <= 75) {
        strBar.style.backgroundColor = 'var(--blue)';
        strText.textContent = 'Epic Secure';
        strText.style.color = 'var(--blue)';
      } else {
        strBar.style.backgroundColor = 'var(--green)';
        strText.textContent = 'Cyber-Safe';
        strText.style.color = 'var(--green)';
      }
    }

    function generateCode() {
      const rawName = nameInput.value.trim();
      const phone = onlyDigits(numberInput.value);

      if (!rawName || !phone) {
        message.textContent = '⚠️ Error: Name aur Number dono fill karein!';
        message.style.color = '#f87171';
        return null;
      }

      const output = buildCode(rawName, phone);

      emailOutput.textContent = output.email;
      userIdOutput.textContent = output.userId;
      passwordOutput.textContent = output.password;
      phoneOutput.textContent = output.phone;

      bulkText.value = `${output.userId}\n${output.password}\n${output.phone}\n${output.email}`;
      updateStrengthMeter(output.password);

      message.textContent = `⚡ System Status: [${activeMode.toUpperCase()}] mode compiled successfully.`;
      message.style.color = 'var(--green)';
      return output;
    }

    async function copyAll() {
      if (emailOutput.textContent === '-') return;
      bulkText.select();
      try {
        await navigator.clipboard.writeText(bulkText.value);
        message.textContent = '✅ Bulk payload copied to clipboard!';
        message.style.color = 'var(--green)';
      } catch (err) {
        message.textContent = '❌ Copy sequence failed.';
        message.style.color = '#f87171';
      }
    }

    async function copySingle(targetId) {
      const textElement = document.getElementById(targetId);
      if (textElement.textContent === '-') return;
      
      try {
        await navigator.clipboard.writeText(textElement.textContent);
        message.textContent = `✅ ${targetId.toUpperCase()} copied successfully.`;
        message.style.color = 'var(--cyan)';
      } catch (err) {
        message.textContent = '❌ Copy failed.';
      }
    }

    numberInput.addEventListener('input', () => {
      numberInput.value = onlyDigits(numberInput.value).slice(0, 10);
    });

    featureButtons.forEach(button => {
      button.addEventListener('click', () => {
        activeMode = button.dataset.mode;
        featureButtons.forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        generateCode();
      });
    });

    generateBtn.addEventListener('click', generateCode);
    copyBtn.addEventListener('click', copyAll);

    singleCopyButtons.forEach(button => {
      button.addEventListener('click', () => copySingle(button.dataset.copyTarget));
    });

    generateCode();
  </script>
</body>
</html>
